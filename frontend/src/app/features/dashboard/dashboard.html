<main class="p-6">
  <div class="header border-bottom-2 pb-3 border-300">
    <h5 class="text-base text-1 font-medium">
      <i class="pi pi-home text-xl breadcrumbs-icon"></i> / Dashboard
    </h5>
  </div>

  <div class="stats flex gap-6">
    <!-- DASHBOARD -->
    <div class="charts w-9">
      <h2 class="mb-3">Dashboard</h2>
      <div class="flex gap-3">
        <!-- MONTHLY INCOME -->
        <div class="monthly-income flex align-items-center gap-3">
          <div class="circle h-2rem w-2rem text-center vertical-align-middle">
            <i class="pi pi-dollar h-2rem w-2rem font-semibold"></i>
          </div>
          <div class="flex flex-column gap-2">
            <span class="text-lg font-semibold text-3 uppercase">Przychód miesięczny</span>
            <span class="text-4xl font-bold text-1">32620 PLN</span>
          </div>
        </div>

        <div class="divider"></div>

        <!-- AMOUNT OF ORDERS -->
        <p-meterGroup [value]="meterValues">
          <ng-template pTemplate="label" let-item>
            <span class="flex items-center gap-2">
              <i class="pi pi-circle-fill" [class]="item.color"></i>
              {{ item.label }}
            </span>
          </ng-template>
        </p-meterGroup>
      </div>
    </div>
  </div>
</main>
