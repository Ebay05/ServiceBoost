<main class="flex h-screen">
  <div
    class="h-full left md:w-5 hidden lg:p-5 p-3 md:flex flex-column justify-content-end"
    style="
      background: url('assets/images/login.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
    "
  >
    <div class="flex-grow-1 flex justify-content-center">
      <img
        src="assets/svg/logo_slogan_color.svg"
        class="w-8 cursor-pointer"
        alt="Logo ServiceBoost"
        routerLink="/"
      />
    </div>
    <p class="text-white font-medium xl:text-3xl md:p-1 md:text-lg text-base font-italic">
      Mechanik nie naprawia tylko samochody - naprawia również czyjś dzień.
    </p>
  </div>
  <div class="right md:w-7 w-12 h-full flex flex-column justify-content-center align-items-center">
    <div
      class="lg:w-6 w-12 p-5 flex flex-grow-1 gap-3 flex-column justify-content-center align-items-center"
    >
      <h1 class="font-semibold text-center">Witaj ponownie!</h1>
      <p-floatlabel class="w-full">
        <input [(ngModel)]="email" id="username" pInputText class="w-full" type="email" />
        <label for="username">Nazwa użytkownika</label>
      </p-floatlabel>

      <p-floatlabel class="w-full">
        <input [(ngModel)]="password" id="password" pInputText class="w-full" type="password" />
        <label for="password">Hasło</label>
      </p-floatlabel>

      <div class="w-full">
        <a href="odzyskiwanie-hasla" class="text-red-500 font-medium">Zapomniałem hasła</a>
        <p class="font-normal flex align-items-center gap-2 py-3">
          Zapamiętaj mnie <p-toggleswitch [(ngModel)]="rememberUser" />
        </p>
      </div>

      <p-button label="Zaloguj" styleClass="px-6" (click)="login()"></p-button>
    </div>
    <footer class="w-full p-3 flex flex-grow-0 justify-content-center">
      <p class="text-xs text-center">ServiceBoost Copyrights {{ year }} © All rights reserved.</p>
    </footer>
  </div>
</main>
